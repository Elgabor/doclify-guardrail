name: Docs Check

permissions:
  contents: read

on:
  push:
    paths:
      - 'examples/**'
      - '*.md'
      - '*.mdx'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'action/**'
      - 'bench/baselines/perf-300.json'
      - 'package.json'
  pull_request:
    paths:
      - 'examples/**'
      - '*.md'
      - '*.mdx'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'action/**'
      - 'bench/baselines/perf-300.json'
      - 'package.json'

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - name: Install action dependencies
        working-directory: action
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify action bundle parity
        working-directory: action
        run: |
          npm run build
          git diff --exit-code -- dist/index.mjs dist/licenses.txt
      - name: Audit action dependency chain
        working-directory: action
        run: npm audit --omit=dev
      - name: Run isolated correctness profile
        run: npm run test:correctness
      - name: Gate labeled rule correctness
        run: npm run test:labeled
      - name: Test controlled local network behavior
        run: npm run test:network
      - name: Run 300-document performance profile
        run: npm run test:performance
      - name: Verify docs sync
        run: npm run docs:sync-check
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Docs integrity gate
        run: node ./src/index.mjs check README.md --format compact
