name: Docs Check

permissions:
  contents: read

on:
  push:
    paths:
      - 'examples/**'
      - 'evidence/**'
      - '*.md'
      - '*.mdx'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'action/**'
      - 'bench/baselines/perf-300.json'
      - 'package.json'
  pull_request:
    paths:
      - 'examples/**'
      - 'evidence/**'
      - '*.md'
      - '*.mdx'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'action/**'
      - 'bench/baselines/perf-300.json'
      - 'package.json'

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - name: Install action dependencies
        working-directory: action
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify action bundle parity
        working-directory: action
        run: |
          npm run build
          git diff --exit-code -- dist/index.mjs dist/licenses.txt
      - name: Smoke Action v2 adapter on the checked-out commit
        id: action-smoke
        uses: ./action
        with:
          path: examples/evidence-demo/README.md
      - name: Verify Action v2 outputs
        env:
          DOCLIFY_STATUS: ${{ steps.action-smoke.outputs.status }}
          DOCLIFY_COMPLETE: ${{ steps.action-smoke.outputs.complete }}
          DOCLIFY_BLOCKING: ${{ steps.action-smoke.outputs.blocking }}
        run: test "$DOCLIFY_STATUS" = pass && test "$DOCLIFY_COMPLETE" = true && test "$DOCLIFY_BLOCKING" = 0
      # This full-SHA pin proves public installation of the stable release;
      # the local ./action smoke above remains the coverage for current HEAD.
      - name: Smoke released Action v2.0.0 from an immutable reference
        id: action-sha-smoke
        uses: Elgabor/doclify-guardrail/action@5ce78dcda488c3734b10ba2a5fdbf4b44fd20985
        with:
          path: evidence/private-beta-protocol.md
      - name: Verify immutable Action reads the caller workspace
        env:
          DOCLIFY_STATUS: ${{ steps.action-sha-smoke.outputs.status }}
          DOCLIFY_COMPLETE: ${{ steps.action-sha-smoke.outputs.complete }}
          DOCLIFY_FILES: ${{ steps.action-sha-smoke.outputs.files }}
          DOCLIFY_BLOCKING: ${{ steps.action-sha-smoke.outputs.blocking }}
        run: test "$DOCLIFY_STATUS" = pass && test "$DOCLIFY_COMPLETE" = true && test "$DOCLIFY_FILES" = 1 && test "$DOCLIFY_BLOCKING" = 0
      - name: Audit action dependency chain
        working-directory: action
        run: npm audit --omit=dev
      - name: Run isolated correctness profile
        run: npm run test:correctness
      - name: Gate labeled rule correctness
        run: npm run test:labeled
      - name: Test controlled local network behavior
        run: npm run test:network
      # The reviewed tolerance is deliberately broad: this catches only macroscopic regressions.
      - name: Reject catastrophic performance regressions
        run: npm run test:performance
      - name: Verify docs sync
        run: npm run docs:sync-check
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Docs integrity gate
        run: node ./src/index.mjs check README.md --format compact
