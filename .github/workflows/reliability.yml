name: Reliability

permissions:
  contents: read

on:
  push:
    paths:
      - '.github/workflows/reliability.yml'
      - 'action/**'
      - 'bench/**'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/reliability.yml'
      - 'action/**'
      - 'bench/**'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.4'
      - name: Install Action test dependencies
        working-directory: action
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run isolated correctness profile
        run: npm run test:correctness
      - name: Gate labeled rule correctness
        run: npm run test:labeled

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.4'
      - name: Test controlled local network behavior
        run: npm run test:network

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.4'
      # The reviewed tolerance is deliberately broad: this catches only macroscopic regressions.
      - name: Reject catastrophic performance regressions
        run: npm run test:performance
