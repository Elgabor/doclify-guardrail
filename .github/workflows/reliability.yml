name: Reliability

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reliability.yml'
      - 'action/**'
      - 'bench/**'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
  pull_request:
    paths:
      - '.github/workflows/reliability.yml'
      - 'action/**'
      - 'bench/**'
      - 'package.json'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Docs Check covers Node 24, including network and performance.
        node: ['20.20.2', '22.23.4', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Install Action test dependencies
        working-directory: action
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run isolated correctness profile
        run: npm run test:correctness
      - name: Gate labeled rule correctness
        run: npm run test:labeled

      - name: Test controlled local network behavior
        if: ${{ !cancelled() && matrix.node == '26.13.0' }}
        run: npm run test:network
