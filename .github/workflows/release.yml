name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated release tag (v<major>.<minor>.<patch>) on main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tag-object: ${{ steps.verify.outputs.tag-object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          check-latest: true
          package-manager-cache: false
      - name: Verify annotated tag, main ancestry and package version
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node .github/scripts/verify-release.mjs
      - name: Check out the verified release commit
        env:
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
        run: git -c advice.detachedHead=false checkout --detach "$RELEASE_COMMIT"
      - name: Install locked Action build dependencies
        working-directory: action
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Action bundle parity
        working-directory: action
        run: |
          npm run build
          git diff --exit-code -- dist/index.mjs dist/licenses.txt
      - name: Test release candidate
        run: |
          npm test
          npm run test:network
          npm run docs:sync-check
      - name: Inspect package without publishing
        run: npm pack --dry-run --json --ignore-scripts

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          check-latest: true
          package-manager-cache: false
      - name: Revalidate tag before publication
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.test.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.test.outputs.tag-object }}
        run: node .github/scripts/verify-release.mjs
      - name: Check out the tested release commit
        env:
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: git -c advice.detachedHead=false checkout --detach "$RELEASE_COMMIT"
      - name: Require npm with Trusted Publishing support
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (![major, minor, patch].every(Number.isInteger)
            || !(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            throw new Error('npm >= 11.5.1 is required for Trusted Publishing.');
          }
          console.log(`npm ${version}: Trusted Publishing minimum satisfied.`);
          JS
      - name: Publish tested package with npm Trusted Publishing
        run: npm publish --access public --ignore-scripts --registry https://registry.npmjs.org
