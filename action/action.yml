name: 'Doclify Guardrail v2'
description: 'Deterministic, local documentation integrity checks for Markdown repositories.'
author: 'Elgabor'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'Selection mode: check or changed'
    default: 'check'
  path:
    description: 'One file, directory, or glob target when mode is check'
    default: '.'
  base:
    description: 'Git base revision when mode is changed'
    default: ''
  staged:
    description: 'Select staged Markdown when mode is changed'
    default: 'false'
  config:
    description: 'Workspace-contained v2 configuration file'
    default: ''
  ignore-rules:
    description: 'Comma-separated rule ids to ignore'
    default: ''
  exclude:
    description: 'Comma-separated workspace paths to exclude'
    default: ''
  site-root:
    description: 'Workspace-contained root for site-relative links'
    default: ''
  external-links:
    description: 'Explicitly enable advisory remote-link checks'
    default: 'false'
  link-allow-list:
    description: 'Comma-separated remote URL or hostname allow list'
    default: ''
  link-timeout-ms:
    description: 'Positive remote-link timeout in milliseconds'
    default: ''
  link-concurrency:
    description: 'Positive remote-link concurrency limit'
    default: ''

outputs:
  status:
    description: 'pass, fail, or incomplete from the v2 result'
  complete:
    description: 'Whether the scan completed without operational diagnostics'
  files:
    description: 'Number of selected files'
  blocking:
    description: 'Number of verified blocking findings'
  advisory:
    description: 'Number of advisory findings'
  diagnostics:
    description: 'Number of operational diagnostics'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
